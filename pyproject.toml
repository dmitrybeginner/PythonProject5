[project]
name = "pythonproject5"
version = "0.1.0"
description = ""
authors = [
    {name = "dmitry",email = "dmitry_romanof@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "django (>=5.2.6,<6.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "django-filter (>=25.1,<26.0)",
    "djangorestframework-simplejwt (>=5.3.1,<6.0.0)",
    "drf-yasg (>=1.21.10,<2.0.0)",
    "django-cors-headers (>=4.8.0,<5.0.0)",
    "stripe (>=12.5.1,<13.0.0)",
    "celery (>=5.5.3,<6.0.0)",
    "redis (>=6.4.0,<7.0.0)",
    "django-celery-beat (>=2.8.1,<3.0.0)",
    "eventlet (>=0.40.3,<0.41.0)",
    "gunicorn (>=22.0.0,<23.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
coverage = "^7.10.6"
flake8 = "^7.3.0"
black = "^25.9.0"
isort = "^6.0.1"

[tool.flake8]
max-line-length = 119
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "migrations",
]
ignore = ["W503", "E203", "W391"]